name: Update Submodule

# askhb-theme pushes here when the shared palette changes. This only opens a PR;
# merging it is what bumps the pointer and triggers the Cloudflare Pages build.
on:
  repository_dispatch:
    types: [submodule-updated]

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    # Granted here rather than left to the repository's Actions setting. That
    # setting defaults to read-only, which fails this job at `git push` with a
    # 403 long after the dispatch has reported success -- and it is invisible
    # from the code, so a new consumer repeats it. Stating the two scopes the
    # job actually needs also drops every other scope the token would carry.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update submodule
        run: git submodule update --remote theme

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update submodule ${{ github.event.client_payload.submodule }}"
          title: "Auto-update submodule: ${{ github.event.client_payload.submodule }}"
          body: |
            Automated submodule update triggered by changes in ${{ github.event.client_payload.submodule }}

            Latest commit: ${{ github.event.client_payload.ref }}
          branch: update-theme-${{ github.run_number }}
